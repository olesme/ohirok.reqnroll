name: Publish to NuGet

# Started by hand only (Actions -> Run workflow). The GitHub Release it creates at the end is a notes page for people;
# nothing reads it or its tag back, the versions come from NuGet.org.
on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'What to publish: all, or a comma-separated list of groups (folders under src/, e.g. Variants, Reporting, PluginChains.Sdk) and package ids. The in-repo dependencies of what you pick are always published with it.'
        required: false
        default: all
        type: string
      version:
        description: 'NuGet version (e.g. 1.2.3). Empty: the next release number (highest version of any package + 1). An existing release number publishes the picked packages that do not have it yet (finishing a failed run, or adding packages to a release).'
        required: false
        type: string

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      id-token: write   # NuGet Trusted Publishing (OIDC)
      contents: write   # create the GitHub Release (notes page) after publishing

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Resolve packages and version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PACKAGES: ${{ inputs.packages }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Every package under src/: its id, its group (first folder under src/) and its in-repo dependencies.
          $srcRoot = (Resolve-Path src).Path
          $projects = @{}
          foreach ($file in Get-ChildItem src -Recurse -Filter *.csproj | Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' }) {
            $xml = [xml](Get-Content $file.FullName -Raw)
            $id = $xml.Project.PropertyGroup.PackageId | Where-Object { $_ } | Select-Object -First 1
            if (-not $id) { $id = $file.BaseName }
            $refs = @($xml.Project.ItemGroup.ProjectReference | Where-Object { $_ -and $_.Include -and $_.Include -notmatch '\$\(' } |
              ForEach-Object { [System.IO.Path]::GetFullPath((Join-Path $file.DirectoryName $_.Include)) })
            $projects[$file.FullName] = [pscustomobject]@{
              Id = $id
              Group = $file.FullName.Substring($srcRoot.Length + 1).Split([char[]]'\/')[0]
              Refs = $refs
            }
          }
          $allIds = @($projects.Values | ForEach-Object Id)

          # The packages to publish: the picked ones plus, transitively, the in-repo packages they depend on, so every
          # published package depends only on versions that are published too.
          $request = if ([string]::IsNullOrWhiteSpace($env:INPUT_PACKAGES)) { 'all' } else { $env:INPUT_PACKAGES }
          $tokens = @($request -split '[,;\s]+' | Where-Object { $_ })
          $picked = @{}
          foreach ($t in $tokens) {
            $match = @($projects.GetEnumerator() | Where-Object { $t -eq 'all' -or $_.Value.Group -eq $t -or $_.Value.Id -eq $t })
            if ($match.Count -eq 0) { throw "'$t' is neither a group (a folder under src/) nor a package id. Packages: $($allIds -join ', ')" }
            foreach ($m in $match) { $picked[$m.Key] = $true }
          }
          $queue = [System.Collections.Generic.Queue[string]]::new([string[]]@($picked.Keys))
          while ($queue.Count -gt 0) {
            foreach ($ref in $projects[$queue.Dequeue()].Refs) {
              if ($projects.ContainsKey($ref) -and -not $picked.ContainsKey($ref)) { $picked[$ref] = $true; $queue.Enqueue($ref) }
            }
          }
          $packages = @($picked.Keys | ForEach-Object { $projects[$_].Id } | Sort-Object)
          Write-Host "Packages ($($packages.Count) of $($allIds.Count)): $($packages -join ', ')"

          function Get-PublishedVersions([string]$pkg) {
            $uri = "https://api.nuget.org/v3-flatcontainer/$($pkg.ToLowerInvariant())/index.json"
            try { (Invoke-RestMethod -Uri $uri -Method Get).versions }
            catch {
              $code = $_.Exception.Response.StatusCode.value__
              if ($code -eq 404) { return @() }   # never published
              throw "NuGet lookup failed for $pkg (HTTP $code): $($_.Exception.Message)"
            }
          }

          $published = @{}
          foreach ($pkg in $allIds) { $published[$pkg] = @(Get-PublishedVersions $pkg) }
          function Get-Missing([string]$ver) { @($packages | Where-Object { -not ($published[$_] -contains $ver) }) }

          # One release number for the whole repository: the highest stable version of any package on NuGet.org.
          $max = [version]'0.0.0'
          foreach ($pkg in $allIds) {
            foreach ($s in $published[$pkg]) { if ($s -match '^\d+\.\d+\.\d+$' -and ([version]$s) -gt $max) { $max = [version]$s } }
          }
          $anyPublished = @($allIds | Where-Object { $published[$_].Count -gt 0 }).Count -gt 0

          $semver = '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z.-]+)?$'
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_VERSION)) {
            $v = $env:INPUT_VERSION.Trim().TrimStart('v', 'V')
            if ($v -notmatch $semver) { throw "Version must look like 1.2.3. Received: '$($env:INPUT_VERSION)'" }
          }
          else {
            # The next number, from NuGet.org alone. Nothing is published before the build, the tests and the packaging
            # smoke tests have passed, so a run that fails there takes no number. A run that fails while pushing leaves
            # its number on some packages: run again with that version to push the rest.
            $v = if ($anyPublished) { [version]::new($max.Major, $max.Minor, $max.Build + 1).ToString() } else { '0.0.0' }
          }

          if ($v -match '^\d+\.\d+\.\d+$' -and $anyPublished -and ([version]$v) -lt $max) {
            throw "$v is below the current release $max. Releases only move forward; use $max to add packages to it, or a higher number."
          }
          $missing = @(Get-Missing $v)
          if ($missing.Count -eq 0) { throw "$v is already published for every picked package: $($packages -join ', ')." }
          # Some picked packages already have this version (a run that died half-way, or an earlier run of the same
          # release with other packages): push the missing ones and skip those already on NuGet.org.
          $resume = $missing.Count -lt $packages.Count

          # A skipped package stays what was published as $v, and the pushed ones depend on it. That is only right if
          # its code is the same now as in the commit $v of it was built from, which NuGet.org records in its nuspec.
          if ($resume) {
            $shared = @('Directory.Build.props', 'Directory.Packages.props', 'GeneratorPluginPackaging.targets') | Where-Object { Test-Path $_ }
            $changed = @()
            foreach ($key in $picked.Keys) {
              $id = $projects[$key].Id
              if ($missing -contains $id) { continue }
              $nuspec = "https://api.nuget.org/v3-flatcontainer/$($id.ToLowerInvariant())/$v/$($id.ToLowerInvariant()).nuspec"
              $commit = ([xml](Invoke-WebRequest -Uri $nuspec -UseBasicParsing).Content).package.metadata.repository.commit
              if (-not $commit) { throw "$id $v on NuGet.org records no source commit, so it cannot be checked against this one." }
              $dir = [System.IO.Path]::GetRelativePath((Get-Location).Path, (Split-Path $key -Parent))
              git diff --quiet $commit HEAD -- $dir @shared
              if ($LASTEXITCODE -ne 0) { $changed += "$id (published from $($commit.Substring(0, 7)))" }
            }
            if ($changed.Count -gt 0) {
              throw "$v cannot get these packages: $($missing -join ', '). They need $($changed -join ', ') as built now, but $v of those was published from other code. Publish a new release number instead."
            }
          }

          "version=$v" >> $env:GITHUB_OUTPUT
          "resume=$($resume.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "packages=$($packages -join ';')" >> $env:GITHUB_OUTPUT
          "pushed=$($missing -join ';')" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing $v (packages missing it: $($missing -join ', '); skip duplicates: $resume)"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build Ohirok.Reqnroll.slnx -c Release "-p:Version=$env:VERSION"

      - name: Test gate
        shell: pwsh
        run: ./scripts/run-tests.ps1 -Configuration Release

      # Every package is packed, so the smoke tests check the whole set from this commit; only the picked ones are pushed.
      - name: Pack
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'artifacts/publish'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Get-ChildItem src -Recurse -Filter *.csproj | Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' } | ForEach-Object {
            dotnet pack $_.FullName -c Release --no-build -o $out "-p:Version=$env:VERSION" "-p:PackageVersion=$env:VERSION"
            if ($LASTEXITCODE -ne 0) { throw "pack failed for $($_.Name)" }
          }

      # The exact files about to be pushed, consumed purely through PackageReference on all four runners.
      - name: Packaging smoke tests (against the publish artifacts)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/test-packages.ps1 -Version $env:VERSION -FeedSource artifacts/publish

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: OlesMe

      - name: Push to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          RESUME: ${{ steps.version.outputs.resume }}
          VERSION: ${{ steps.version.outputs.version }}
          PACKAGES: ${{ steps.version.outputs.packages }}
        run: |
          $ErrorActionPreference = 'Stop'
          # No --skip-duplicate on a normal run: any failure, a duplicate version included, must turn the job red.
          # Only when some picked packages already have the version are those skipped.
          $dup = @(); if ($env:RESUME -eq 'true') { $dup = @('--skip-duplicate') }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $src = 'https://api.nuget.org/v3/index.json'

          function Get-EntryBaseNames([string]$zipPath, [string[]]$extensions) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
            try {
              $zip.Entries |
                Where-Object { $extensions -contains [System.IO.Path]::GetExtension($_.Name).ToLowerInvariant() } |
                ForEach-Object { [System.IO.Path]::GetFileNameWithoutExtension($_.Name).ToLowerInvariant() }
            } finally { $zip.Dispose() }
          }

          $pkgs = @($env:PACKAGES -split ';' | Where-Object { $_ } | ForEach-Object {
            $file = Join-Path 'artifacts/publish' "$_.$env:VERSION.nupkg"
            if (-not (Test-Path $file)) { throw "Package file not found: $file" }
            Get-Item $file
          })
          if (-not $pkgs) { throw 'Nothing to push.' }

          foreach ($pkg in $pkgs) {
            Write-Host "Pushing $($pkg.Name)"
            dotnet nuget push $pkg.FullName --api-key $env:NUGET_API_KEY --source $src --no-symbols @dup
            if ($LASTEXITCODE -ne 0) { throw "NuGet push failed for $($pkg.Name)." }
          }

          # NuGet.org rejects a .snupkg containing a pdb whose dll is not in the .nupkg; skip those explicitly.
          foreach ($pkg in $pkgs) {
            $snupkg = [System.IO.Path]::ChangeExtension($pkg.FullName, '.snupkg')
            if (-not (Test-Path $snupkg)) { continue }
            $dlls = @(Get-EntryBaseNames $pkg.FullName @('.dll', '.exe'))
            $orphans = @(Get-EntryBaseNames $snupkg @('.pdb') | Where-Object { $dlls -notcontains $_ })
            if ($orphans.Count -gt 0) {
              Write-Host "::warning::Skipping symbols for $($pkg.Name): pdb without dll: $($orphans -join ', ')"
              continue
            }
            dotnet nuget push $snupkg --api-key $env:NUGET_API_KEY --source $src @dup
            if ($LASTEXITCODE -ne 0) { throw "Symbols push failed for $([System.IO.Path]::GetFileName($snupkg))." }
          }

      # A notes page for people, after everything was published. Adding packages to a release later appends them to its
      # page. Nothing reads the release or its tag back: versions come from NuGet.org only.
      - name: GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PUSHED: ${{ steps.version.outputs.pushed }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:VERSION"
          $list = ($env:PUSHED -split ';' | Where-Object { $_ } | ForEach-Object { "- [$_ $env:VERSION](https://www.nuget.org/packages/$_/$env:VERSION)" }) -join "`n"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            $notes = (gh release view $tag --json body --jq .body) + "`n`n### Added from $($env:GITHUB_SHA.Substring(0, 7))`n`n$list"
            gh release edit $tag --notes $notes
          }
          else {
            gh release create $tag --target $env:GITHUB_SHA --title $env:VERSION --generate-notes --notes "### Packages`n`n$list"
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not create or update the GitHub Release $tag." }
