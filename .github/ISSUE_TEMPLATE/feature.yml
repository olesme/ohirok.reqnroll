name: Feature request
description: Propose a new capability or a change to an existing one.
labels: [enhancement]
body:
  - type: input
    id: package
    attributes:
      label: Package
      placeholder: Ohirok.Reporting.ReqnrollPlugin
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why the current behaviour is not enough.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could look from the user's side (tags, hashtags, reqnroll.json keys, API).
